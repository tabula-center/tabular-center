# `jvmToolchain(21)` asks Gradle for a JDK 21. Left to itself Gradle will
# DOWNLOAD one if it does not find a match, which is a network access the
# offline build cannot make and which no repository list controls -- it goes to
# a toolchain provisioner, not to Maven. The failure is a timeout partway
# through configuration, well away from anything the lock file governs.
#
# Every supported way of building this has a 21 already: nix supplies jdk21,
# and a build without nix is expected to bring one. So the honest setting is
# "use what is here, and say so if it is wrong" rather than "fetch one".
org.gradle.java.installations.auto-download=false

# A daemon outlives the build and writes to paths a sandbox will not have.
org.gradle.daemon=false
