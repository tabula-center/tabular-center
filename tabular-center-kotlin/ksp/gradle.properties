# The processor is an included build, and an included build reads its own
# gradle.properties. The example's copy does not reach it, so `jvmToolchain(21)`
# here would still be free to go and download a JDK -- from a provisioner, not
# from Maven, so tabular-center-kotlin/nix/gradle-lock.json has no say in it and the offline build
# fails on a network access no repository list controls.
#
# The same two lines, for the same reasons, in the file that governs them.
org.gradle.java.installations.auto-download=false
org.gradle.daemon=false
