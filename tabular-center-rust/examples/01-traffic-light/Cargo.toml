[package]
name = "traffic-light"
description = "1. The minimum: three states, two actions, no payloads, no effects"
version = "0.0.1"
edition = "2021"
rust-version = "1.75"
license = "MIT"
publish = false

# The configuration corner this example covers: `default-features = false`.
#
# tabular-center's `export` and `lint` modules are gated on `alloc`; everything a
# machine needs to run is not. A machine with no payloads and no effects is the
# honest place to prove that, so this crate is `#![no_std]` and takes tabular-center
# with no features at all. If the macro ever grows an allocation, this fails
# here rather than on someone's firmware.
[dependencies]
tabular-center = { path = "../../tabular-center", default-features = false }
