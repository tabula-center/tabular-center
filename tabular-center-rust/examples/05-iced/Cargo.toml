# Its own package, outside `tabular-center-rust/examples`'s workspace, and its own lock.
#
# iced's floor and the library's MSRV move independently (dependencies.toml:
# `rust-gui` and `rust`), and one workspace would tie them together.
# `rust-version` below is this application's, not the library's.
[workspace]

[package]
name = "iced-connection"
description = "5. A GUI: the same machine driving iced, with the toolkit knowing nothing about it"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[dependencies]
tabular-center = { path = "../../tabular-center" }
iced = "0.14"
