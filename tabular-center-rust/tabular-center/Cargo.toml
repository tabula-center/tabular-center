[package]
name = "tabular-center"
description = "Transition-matrix state machines whose completeness is enforced by the compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# What crates.io shows. The README is the crate's own, not the monorepo's:
# the published archive holds this directory and nothing above it.
readme = "README.md"
homepage = "https://tabula-center.github.io/tabular-center/doc/rust"
keywords = ["state-machine", "fsm", "transition-matrix", "no-std", "macro"]
categories = ["rust-patterns", "no-std", "data-structures"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []

# No dependencies. Not "few" — none. The matrix macro is `macro_rules!`,
# which is part of the language, so there is no proc-macro crate and no
# build-graph cost. See ARCHITECTURE.md section 11.1.
[dependencies]

# Dispatch cost against hand-written code. Its own `main`, so no test harness,
# and no dev-dependency: it times with std alone. `test = false` keeps it out
# of `cargo test` -- timing is not a check -- while `cargo clippy
# --all-targets` still compiles it. Run: `cargo bench --bench dispatch`.
[[bench]]
name = "dispatch"
harness = false
test = false
