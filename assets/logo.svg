<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">tabular-center</title>
  <!-- The center of a table: a transition matrix with every cell decided,
       and the center cell marked. Nine squares and one accent, so it reads
       at favicon size. -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <g fill="#2dd4bf">
    <rect x="7"  y="7"  width="14" height="14" rx="3"/>
    <rect x="25" y="7"  width="14" height="14" rx="3"/>
    <rect x="43" y="7"  width="14" height="14" rx="3"/>
    <rect x="7"  y="25" width="14" height="14" rx="3"/>
    <rect x="43" y="25" width="14" height="14" rx="3"/>
    <rect x="7"  y="43" width="14" height="14" rx="3"/>
    <rect x="25" y="43" width="14" height="14" rx="3"/>
    <rect x="43" y="43" width="14" height="14" rx="3"/>
  </g>
  <rect x="25" y="25" width="14" height="14" rx="3" fill="#f59e0b"/>
</svg>
