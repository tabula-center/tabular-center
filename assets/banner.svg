<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">tabular-center</title>
  <desc id="desc">A state machine declared as a transition matrix: states are rows,
    actions are columns, every cell holds a decision. One cell is missing, and the
    compiler refuses it with tabular-center::row-arity. For Rust, Kotlin and Swift.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: Inter, "Segoe UI", Helvetica, Arial, "DejaVu Sans", sans-serif; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .head { fill: #94a3b8; font-size: 20px; }
    .cell { fill: #1e293b; stroke: #334155; stroke-width: 1.5; }
    .cellText { fill: #e2e8f0; font-size: 16px; }
    .quiet { fill: #64748b; font-size: 16px; }
  </style>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- left: the name and the promise -->
  <g transform="translate(72 84) scale(1.375)">
    <rect width="64" height="64" rx="14" fill="#0f172a" stroke="#1e293b"/>
    <g fill="#2dd4bf">
      <rect x="7" y="7" width="14" height="14" rx="3"/><rect x="25" y="7" width="14" height="14" rx="3"/>
      <rect x="43" y="7" width="14" height="14" rx="3"/><rect x="7" y="25" width="14" height="14" rx="3"/>
      <rect x="43" y="25" width="14" height="14" rx="3"/><rect x="7" y="43" width="14" height="14" rx="3"/>
      <rect x="25" y="43" width="14" height="14" rx="3"/><rect x="43" y="43" width="14" height="14" rx="3"/>
    </g>
    <rect x="25" y="25" width="14" height="14" rx="3" fill="#f59e0b"/>
  </g>
  <text class="sans" x="184" y="146" fill="#f8fafc" font-size="54" font-weight="700">tabular-center</text>

  <text class="sans" x="72" y="262" fill="#e2e8f0" font-size="31">State machines whose declaration</text>
  <text class="sans" x="72" y="304" fill="#e2e8f0" font-size="31">is the transition matrix.</text>

  <text class="sans" x="72" y="384" fill="#94a3b8" font-size="24">Every state × every action, decided —</text>
  <text class="sans" x="72" y="418" fill="#94a3b8" font-size="24">or it does not compile.</text>

  <g class="sans" font-size="22" font-weight="600">
    <rect x="72"  y="500" width="104" height="44" rx="22" fill="#1e293b" stroke="#334155"/>
    <text x="124" y="529" fill="#e2e8f0" text-anchor="middle">Rust</text>
    <rect x="188" y="500" width="118" height="44" rx="22" fill="#1e293b" stroke="#334155"/>
    <text x="247" y="529" fill="#e2e8f0" text-anchor="middle">Kotlin</text>
    <rect x="318" y="500" width="108" height="44" rx="22" fill="#1e293b" stroke="#334155"/>
    <text x="372" y="529" fill="#e2e8f0" text-anchor="middle">Swift</text>
  </g>
  <text class="sans" x="72" y="604" fill="#64748b" font-size="20">one matrix, three compilers</text>

  <!-- right: the matrix -->
  <g class="mono head" text-anchor="middle">
    <text x="867"  y="118">Start</text>
    <text x="1009" y="118">Ready</text>
    <text x="1151" y="118">Drop</text>
  </g>
  <g class="mono head" text-anchor="end">
    <text x="790" y="186">Idle</text>
    <text x="790" y="278">Connecting</text>
    <text x="790" y="370">Live</text>
  </g>

  <!-- Idle -->
  <rect class="cell" x="802" y="140" width="130" height="74" rx="10"/>
  <text class="mono cellText" x="867" y="183" text-anchor="middle">→ Connecting</text>
  <rect class="cell" x="944" y="140" width="130" height="74" rx="10"/>
  <text class="mono quiet" x="1009" y="183" text-anchor="middle">IGNORE</text>
  <rect class="cell" x="1086" y="140" width="130" height="74" rx="10"/>
  <text class="mono quiet" x="1151" y="183" text-anchor="middle">IGNORE</text>

  <!-- Connecting: the center cell is the happy path's hop -->
  <rect class="cell" x="802" y="232" width="130" height="74" rx="10"/>
  <text class="mono quiet" x="867" y="275" text-anchor="middle">IGNORE</text>
  <rect x="944" y="232" width="130" height="74" rx="10" fill="#f59e0b"/>
  <text class="mono" x="1009" y="275" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="700">→ Live</text>
  <rect class="cell" x="1086" y="232" width="130" height="74" rx="10"/>
  <text class="mono" x="1151" y="275" text-anchor="middle" fill="#2dd4bf" font-size="16">HANDLE</text>

  <!-- Live: one cell missing -->
  <rect class="cell" x="802" y="324" width="130" height="74" rx="10"/>
  <text class="mono quiet" x="867" y="367" text-anchor="middle">IGNORE</text>
  <rect class="cell" x="944" y="324" width="130" height="74" rx="10"/>
  <text class="mono quiet" x="1009" y="367" text-anchor="middle">IGNORE</text>
  <rect x="1086" y="324" width="130" height="74" rx="10" fill="none" stroke="#f87171" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text class="sans" x="1151" y="373" text-anchor="middle" fill="#f87171" font-size="34" font-weight="700">?</text>

  <!-- what the compiler says about it -->
  <rect x="680" y="440" width="536" height="104" rx="12" fill="#1a0f14" stroke="#7f1d1d"/>
  <text class="mono" x="704" y="482" fill="#f87171" font-size="19" font-weight="700">error: tabular-center::row-arity</text>
  <text class="mono" x="704" y="516" fill="#fecaca" font-size="17">row `Live` has 2 cells; `actions` declares 3.</text>
</svg>
