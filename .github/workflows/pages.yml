# Publish docs/ to GitHub Pages.
#
# docs/ is generated from spec/ and is NOT in the repository. Committing it
# would put a second copy of normative text in the tree, maintained by whoever
# remembered to run the generator -- the same failure this project has spent a
# long time removing everywhere else. So Pages builds from an artifact rather
# than from a branch or a folder.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time, and never cancel one halfway: an interrupted deploy
# leaves the site serving a mix of two builds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No nix. The generator is bash over sed, deliberately, so the docs can
      # be built by anything with a shell -- see CONTRIBUTING.md on supporting
      # both nix and non-nix paths.
      - name: Generate docs/ from spec/
        run: ./tools/docs

      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
