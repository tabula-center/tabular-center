name: ci

on:
  push: { branches: [main] }
  pull_request:

# CI runs `nix flake check` and nothing else.
#
# It used to duplicate the command list from flake.nix, which meant three
# different definitions of "green": the workflow, the flake, and whatever a
# developer typed locally. Three lints escaped through those gaps. Now the
# flake's checks call `tools/verify <step>`, and CI calls the flake, so all
# three run the same commands by construction.
#
# The trade is that CI needs a Nix installation (~20s) and gets less granular
# step names in the UI. Worth it: a check that can disagree with local is a
# check people learn to distrust.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: nix flake check
        run: nix flake check --print-build-logs

  # Swift is primary on Darwin: nixpkgs' Linux swift lags and macro plugins are
  # toolchain-version sensitive. Gated on Package.swift so it no-ops until
  # phase 5 rather than sitting red.
  check-darwin:
    runs-on: macos-14
    if: hashFiles('swift/Package.swift') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix flake check --print-build-logs
