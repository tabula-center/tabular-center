name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75.0
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf
      - run: cd rust && cargo fmt --all -- --check
      - run: cd rust && cargo clippy --all-targets --all-features -- -D warnings
      - run: cd rust && cargo test --all-features
      - run: ./tools/compile-fail
      - run: cd rust && cargo run -q -p tabula-conformance
      # Phase 1 exit criterion: core must build without std.
      - run: cd rust && cargo build -p tabula --no-default-features --target thumbv7em-none-eabihf

  kotlin:
    runs-on: ubuntu-latest
    if: hashFiles('kotlin/settings.gradle.kts') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: cd kotlin && ./gradlew test

  # Swift is primary on Darwin; nixpkgs' Linux swift lags and macro plugins
  # are toolchain-version sensitive. See ARCHITECTURE.md section 13.
  swift:
    runs-on: macos-14
    if: hashFiles('swift/Package.swift') != ''
    steps:
      - uses: actions/checkout@v4
      - run: cd swift && swift test
