# Publishes a release: what `nix run .#publish -- --execute` does by hand,
# one registry per job, each job holding only its own registry's credentials.
#
#   nix run .#release -- 0.1.0   # by hand: VERSION, manifests, verify, tag v0.1.0
#   git push --follow-tags       # by hand: this workflow, and swift-mirror, run
#
# Security, in the order it matters (RELEASING.md has the setup):
# - crates.io uses trusted publishing: GitHub's OIDC identity for this job is
#   exchanged for a token that is revoked when the job ends. No stored secret.
# - Maven Central has no OIDC, so it needs a stored user token and a signing
#   key. They live only in the `maven-central` environment, which should
#   require a reviewer and allow only `v*` tags.
# - Every action is pinned to a commit: a moved tag cannot change code that
#   holds credentials. Checkout does not keep its token in .git/config. No
#   shared Nix cache in these jobs -- a poisoned cache is a way into a release.
# - `verify` reruns the checks on the tagged commit, holding no credentials: a
#   tag can be pushed on a commit CI never saw.
# Swift is not here: swift-mirror.yml publishes it from the same tag.
name: publish

on:
  push:
    tags: ["v*"]
  # By hand, from the Actions tab. From a tag, that tag is published; from a
  # branch, the tag VERSION names -- which must exist. Every job checks out
  # the resolved tag, so a manual run publishes the release, never a branch's
  # current state.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the release tag
        id: release
        run: |
          set -euo pipefail
          declared="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            if [ "${tag#v}" != "$declared" ]; then
              echo "tag $tag says ${tag#v}, VERSION says $declared: not publishing"
              exit 1
            fi
          else
            tag="v$declared"
            if ! git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null; then
              echo "VERSION says $declared, but there is no tag $tag: release it first (nix run .#release)"
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix flake check --print-build-logs

  crates-io:
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    # crates.io's trusted-publisher entry names this repository, this workflow
    # file and this environment; a run that differs in any is refused.
    environment: crates-io
    permissions:
      contents: read
      id-token: write # the OIDC identity crates.io exchanges for a token
    if: ${{ vars.CRATES_IO_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: nix run .#publish -- --execute --only rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  maven-central:
    needs: [resolve, verify]
    # Builds the five-artifact bundle (tabular-center-kotlin/tools/central-bundle),
    # signs it with the subkey, uploads it to the Central Portal and waits for
    # validation. The kotlin-publication check builds the same bundle, with a
    # throwaway key, on every push.
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix run .#publish -- --execute --only kotlin
        env:
          # A Central Portal USER TOKEN pair, not the portal login.
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          # An ASCII-armoured signing SUBKEY, its primary key kept offline.
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
